name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify contracts, runtime, and supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.x

      - name: Install Node dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit Node dependencies
        run: npm audit --audit-level=high --json

      - name: Set up Rust tools
        run: rustup component add clippy rustfmt

      - name: Install Rust dependency audit tool
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Run TypeScript contract and TUI tests
        run: npm test

      - name: Run Rust supervisor tests
        run: cargo test --locked

      - name: Lint Rust supervisor
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check whitespace in repository diff
        run: git diff --check

      - name: Ensure runtime and build artifacts are not tracked
        run: |
          tracked="$(xargs git ls-files < tools/forbidden-tracked-roots.txt)"
          if [ -n "$tracked" ]; then
            echo "Runtime/build artifacts are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Check operator readiness snapshots
        run: |
          npm run ether -- doctor --workspace .
          npm run ether -- security audit --workspace .
