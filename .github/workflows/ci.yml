name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify contracts, runtime, and supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          package-manager-cache: false

      - name: Install Node dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit Node dependencies
        run: npm audit --audit-level=high --json

      - name: Set up Rust tools
        run: rustup component add clippy rustfmt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true

      - name: Install Rust dependency audit tool
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Run TypeScript contract and TUI tests
        run: npm test

      - name: Run Go Bubble Tea TUI tests
        run: go test ./packages/tui-go/...

      - name: Run Rust supervisor tests
        run: cargo test --locked

      - name: Lint Rust supervisor
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check whitespace in repository diff
        run: git diff --check

      - name: Ensure runtime and build artifacts are not tracked
        run: |
          tracked="$(xargs git ls-files < tools/forbidden-tracked-roots.txt)"
          if [ -n "$tracked" ]; then
            echo "Runtime/build artifacts are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Check operator readiness snapshots
        run: |
          npm run ether -- onboarding check --workspace .
          npm run ether -- doctor --workspace .
          npm run ether -- ingress audit --workspace .
          npm run ether -- security audit --workspace .
          npm run ether -- release evidence --workspace .

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true

      - name: Install Node dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Run platform smoke tests
        run: node --test --test-name-pattern "contract examples validate|live model providers map official API surfaces|TUI help|Bare Ether opens|Installed Ether bin opens" packages/*/test/*.test.ts

      - name: Run Go Bubble Tea TUI smoke tests
        run: go test ./packages/tui-go/...

      - name: Run Rust supervisor smoke tests
        run: cargo test --locked

      - name: Check operator readiness snapshot
        run: |
          npm run ether -- onboarding check --workspace .
          npm run ether -- doctor --workspace .
          npm run ether -- ingress audit --workspace .
          npm run ether -- security audit --workspace .
          npm run ether -- release evidence --workspace .
